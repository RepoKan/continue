interface:
  display_name: K Knowledge Entry Gate
  short_description: Bootstrap governed K Knowledge Supporting work with source, Git,
    and public-data guardrails
  brand_color: '#0F766E'
  default_prompt: Use $enter to bootstrap this K Knowledge Supporting task from exact
    repo/ref/SHA evidence, apply public-repository boundaries, and route to the most
    specific workflow.
  icon_small: assets/icon.svg
  icon_large: assets/icon.svg
dependencies:
  tools:
  - type: mcp
    value: github
    description: Inspect and, when explicitly authorized, update GitHub repositories,
      pull requests, Actions, and artifacts
    transport: streamable_http
    url: https://api.githubcopilot.com/mcp/
policy:
  products:
  - chatgpt
  - codex
  - api
  - atlas
  allow_implicit_invocation: true
