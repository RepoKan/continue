name: Validate Candidate Governance SHA

on:
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: Full 40-character commit SHA to validate
        required: true
        type: string

permissions:
  contents: read

jobs:
  validate:
    name: Validate exact candidate commit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Validate SHA input
        shell: bash
        env:
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
        run: |
          [[ "$CANDIDATE_SHA" =~ ^[0-9a-f]{40}$ ]]

      - name: Checkout candidate commit
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.candidate_sha }}
          persist-credentials: false

      - name: Verify exact commit
        shell: bash
        env:
          EXPECTED_SHA: ${{ inputs.candidate_sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

      - name: Validate governance rules
        run: python3 scripts/validate-governance-rules.py

      - name: Validate skill package mirrors
        run: python3 scripts/validate-project-skill-packages.py
