name: KKS Cancel Obsolete Runs

on:
  push:
    branches:
      - codex/k-knowledge-support-tooling-20261001

permissions:
  actions: write
  contents: write

jobs:
  cancel-obsolete:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Cancel obsolete workflow runs
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          for id in \
            36792420646 \
            36792420657 \
            36792215135 \
            36791590710 \
            36791590706 \
            36792420664 \
            36792215210 \
            36792215215
          do
            echo "Cancelling obsolete run $id"
            gh api --method POST "repos/${GITHUB_REPOSITORY}/actions/runs/$id/cancel" || true
          done

      - name: Remove temporary maintenance workflow
        shell: bash
        run: |
          git config user.name "EDCAPP"
          git config user.email "kantapon@loxbit.co.th"
          git rm .github/workflows/kks-cancel-obsolete-runs-temp.yml
          git commit -m "[skip ci] chore: remove temporary CI maintenance workflow"
          git push origin HEAD:${{ github.ref_name }}
