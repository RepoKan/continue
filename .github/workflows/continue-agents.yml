name: Continue Agents

on:
  workflow_call:
    inputs:
      agents-path:
        description: 'Path to agents folder'
        required: false
        default: '.continue/agents'
        type: string
    secrets:
      ANTHROPIC_API_KEY:
        description: 'Anthropic API key for Claude'
        required: true

permissions:
  contents: read
  pull-requests: read

env:
  TARGET_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  discover:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.discover.outputs.matrix }}
      has-agents: ${{ steps.discover.outputs.has_agents }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.TARGET_SHA }}

      - name: Discover agents
        id: discover
        run: |
          AGENTS_DIR="${{ inputs.agents-path }}"
          if [ -d "$AGENTS_DIR" ]; then
            # Use -sc for compact single-line JSON (required for GitHub Actions output)
            FILES=$(find "$AGENTS_DIR" -name "*.md" -type f 2>/dev/null | jq -R . | jq -sc .)
            COUNT=$(echo "$FILES" | jq 'length')
            HAS_AGENTS=$([[ $COUNT -gt 0 ]] && echo "true" || echo "false")
          else
            FILES="[]"
            COUNT=0
            HAS_AGENTS="false"
          fi

          echo "matrix=$FILES" >> $GITHUB_OUTPUT
          echo "has_agents=$HAS_AGENTS" >> $GITHUB_OUTPUT
          echo "Found $COUNT agent(s)"

  run-agent:
    needs: discover
    if: needs.discover.outputs.has-agents == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
      pull-requests: read
    strategy:
      fail-fast: false
      matrix:
        agent: ${{ fromJson(needs.discover.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.TARGET_SHA }}

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'

      - name: Install Continue CLI
        run: npm i -g @continuedev/cli

      - name: Extract agent name
        id: agent-name
        run: |
          AGENT_FILE="${{ matrix.agent }}"
          AGENT_NAME=$(basename "$AGENT_FILE" .md)
          echo "name=$AGENT_NAME" >> $GITHUB_OUTPUT

      - name: Create Check Run
        id: check
        uses: actions/github-script@v8
        env:
          AGENT_NAME: ${{ steps.agent-name.outputs.name }}
          TARGET_SHA: ${{ env.TARGET_SHA }}
        with:
          script: |
            const { data: check } = await github.rest.checks.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              name: `Continue agent execution (informational): ${process.env.AGENT_NAME}`,
              head_sha: process.env.TARGET_SHA,
              status: 'in_progress',
              started_at: new Date().toISOString(),
            });
            core.setOutput('id', check.id);

      - name: Run agent
        id: run
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          AGENT_FILE="${{ matrix.agent }}"

          # Run agent in non-interactive mode (-p flag)
          if OUTPUT=$(cn -p --agent "$AGENT_FILE" 2>&1); then
            echo "success=true" >> $GITHUB_OUTPUT
            echo "Agent process completed; this is not a policy or review verdict."
          else
            echo "success=false" >> $GITHUB_OUTPUT
            echo "Agent process failed; raw output is not copied into the workflow summary or check run."
          fi

      - name: Write job summary
        if: always()
        env:
          AGENT_SUCCESS: ${{ steps.run.outputs.success }}
          AGENT_NAME: ${{ steps.agent-name.outputs.name }}
        run: |
          echo "## 🤖 Agent: $AGENT_NAME" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ "$AGENT_SUCCESS" == "true" ]; then
            echo "**Status:** Agent process completed successfully." >> $GITHUB_STEP_SUMMARY
            echo "This is process evidence only, not a policy verdict, security result, approval, or merge-readiness decision." >> $GITHUB_STEP_SUMMARY
            echo "Agent output is intentionally not published in the workflow summary or check run." >> $GITHUB_STEP_SUMMARY
          else
            echo "**Status:** Agent process failed." >> $GITHUB_STEP_SUMMARY
            echo "The raw agent output is intentionally not published in the workflow summary or check run." >> $GITHUB_STEP_SUMMARY
          fi

      - name: Fail if agent failed
        if: steps.run.outputs.success != 'true'
        run: exit 1

      - name: Update Check Run
        if: always()
        uses: actions/github-script@v8
        env:
          AGENT_SUCCESS: ${{ steps.run.outputs.success }}
          CHECK_RUN_ID: ${{ steps.check.outputs.id }}
        with:
          script: |
            const success = process.env.AGENT_SUCCESS === 'true';
            await github.rest.checks.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              check_run_id: parseInt(process.env.CHECK_RUN_ID, 10),
              status: 'completed',
              conclusion: success ? 'success' : 'failure',
              completed_at: new Date().toISOString(),
              output: {
                title: success ? 'Agent process completed' : 'Agent process failed',
                summary: 'This check reports process completion only. It is not a policy verdict, security result, independent review, or merge-readiness decision. Review authorized evidence and the applicable GOV rules separately. Raw agent output is not attached.',
              },
            });
