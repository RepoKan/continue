name: PR metadata consistency
on:
  pull_request_target:
    types: [opened, edited, reopened, synchronize, ready_for_review, converted_to_draft, closed]
  workflow_dispatch:
    inputs:
      pr_number:
        description: PR number to reconcile against live GitHub metadata
        required: true
        type: string
permissions:
  contents: read
  pull-requests: read
  statuses: write
concurrency:
  # Commit statuses are shared by every PR with the same head SHA.
  # Serialize writers across the repository, not across individual PRs.
  group: pr-metadata-${{ github.repository }}
  cancel-in-progress: false
jobs:
  metadata:
    name: PR metadata consistency
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Validate live state without checking out PR code
        env:
          GH_TOKEN: ${{ github.token }}
          GOVERNED_PR: '17'
        shell: bash
        run: |
          python3 - <<'PY'
          import json, re

          def unique_object(pairs):
              result = {}
              for key, value in pairs:
                  if key in result:
                      raise ValueError("duplicate contract key")
                  result[key] = value
              return result

          def validate(pr, governed):
              body = pr.get("body") or ""
              marker = "pr-state-contract:"
              if pr.get("state") not in ("open", "closed"):
                  raise ValueError("invalid live PR state")
              if pr["state"] == "closed":
                  return "closed PR; no open lifecycle to validate"
              if marker not in body and not governed:
                  return "outside opt-in scope"
              matches = re.findall(r"<!--\s*pr-state-contract:\s*(.*?)\s*-->", body, re.S)
              if len(matches) != 1 or body.count(marker) != 1:
                  raise ValueError("exactly one state contract is required")
              contract = json.loads(matches[0], object_pairs_hook=unique_object)
              keys = {"schema", "gate", "required_draft", "recorded_head_sha"}
              if not isinstance(contract, dict) or set(contract) != keys:
                  raise ValueError("invalid contract fields")
              if type(contract["schema"]) is not int or contract["schema"] != 1:
                  raise ValueError("unsupported schema")
              if contract["gate"] not in ("HOLD", "READY"):
                  raise ValueError("invalid decision gate")
              if type(contract["required_draft"]) is not bool or type(pr.get("draft")) is not bool:
                  raise ValueError("draft fields must be booleans")
              if contract["required_draft"] != (contract["gate"] == "HOLD"):
                  raise ValueError("decision gate contradicts required draft state")
              if pr["draft"] != contract["required_draft"]:
                  raise ValueError("live GitHub draft state contradicts contract")
              sha = contract["recorded_head_sha"]
              if not isinstance(sha, str) or not re.fullmatch(r"[0-9a-f]{40}", sha):
                  raise ValueError("invalid recorded head SHA")
              if sha != pr.get("head", {}).get("sha"):
                  raise ValueError("recorded SHA is stale; reconcile evidence for live head")
              return "metadata consistent; independent merge gates still apply"
          def self_test():
              sha = "a" * 40
              base = {"schema": 1, "gate": "READY", "required_draft": False, "recorded_head_sha": sha}
              def pr(c=None, draft=False):
                  return {"state": "open", "draft": draft, "head": {"sha": sha}, "body": "<!-- pr-state-contract: " + json.dumps(base if c is None else c) + " -->"}
              cases = [
                  (pr(), True, True),
                  (pr(dict(base, gate="HOLD", required_draft=True), True), True, True),
                  (pr(dict(base, gate="HOLD", required_draft=True)), True, False),
                  (pr(dict(base, recorded_head_sha="b" * 40)), True, False),
                  (pr(dict(base, required_draft="false")), True, False),
                  (pr(dict(base, schema=True)), True, False),
                  (pr(dict(base, gate="PASS")), True, False),
                  (pr(dict(base, extra=True)), True, False),
                  (dict(pr(), body=""), True, False),
                  (dict(pr(), body=""), False, True),
                  (dict(pr(), body=pr()["body"] * 2), True, False),
                  (dict(pr(), body="<!-- pr-state-contract: {oops} -->"), True, False),
                  (dict(pr(), body=pr()["body"].replace('"schema": 1', '"schema": 1, "schema": 1')), True, False),
                  (dict(pr(), state=None), True, False),
                  (dict(pr(), draft=None), True, False),
                  (dict(pr(), state="closed"), True, True),
                  (pr(dict(base, gate="HOLD", required_draft=False)), True, False),
              ]
              for index, (candidate, governed, expected) in enumerate(cases):
                  try:
                      validate(candidate, governed)
                      actual = True
                  except (ValueError, TypeError):
                      actual = False
                  if actual != expected:
                      raise ValueError("metadata regression " + str(index) + " failed")
              print("Metadata regression cases: " + str(len(cases)) + " PASS")
          def head_snapshot(pulls, sha):
              selected = [pr for pr in pulls if pr.get("state") == "open"
                          and pr.get("head", {}).get("sha") == sha]
              return sorted(selected, key=lambda pr: pr["number"])

          def evaluate_head(pulls, sha, governed_number):
              related = head_snapshot(pulls, sha)
              if not related:
                  raise ValueError("no open PR remains for this head")
              for candidate in related:
                  validate(candidate, candidate["number"] == governed_number)
                  matches = re.findall(r"<!--\s*pr-state-contract:\s*(.*?)\s*-->",
                                       candidate.get("body") or "", re.S)
                  hold = bool(matches) and json.loads(matches[0])["gate"] == "HOLD"
                  if candidate.get("draft") or hold:
                      raise ValueError("an open PR sharing this head is HOLD or Draft")
              return "All open PRs sharing this head satisfy metadata checks"

          def aggregate_self_test():
              sha = "a" * 40
              ready = {"number": 1, "state": "open", "draft": False,
                       "head": {"sha": sha}, "body": ""}
              hold = dict(ready, number=2, draft=True, body="<!-- pr-state-contract: " +
                          json.dumps({"schema": 1, "gate": "HOLD", "required_draft": True,
                                      "recorded_head_sha": sha}) + " -->")
              cases = [
                  ([ready], True),
                  ([ready, hold], False),
                  ([hold, ready], False),
                  ([ready, dict(hold, draft=False)], False),
                  ([ready, dict(hold, state="closed")], True),
                  ([ready, dict(hold, head={"sha": "b" * 40})], True),
                  ([dict(ready, draft=True)], False),
                  ([], False),
                  ([dict(ready, number=12)], False),
                  ([dict(ready, body="<!-- pr-state-contract: {oops} -->")], False),
              ]
              for index, (pulls, expected) in enumerate(cases):
                  try:
                      evaluate_head(pulls, sha, 12)
                      actual = True
                  except (ValueError, TypeError, KeyError):
                      actual = False
                  if actual != expected:
                      raise ValueError("shared-head regression " + str(index) + " failed")
              print("Shared-head regression cases: " + str(len(cases)) + " PASS")

          self_test()
          aggregate_self_test()
          import os, urllib.request
          with open(os.environ["GITHUB_EVENT_PATH"], encoding="utf-8") as stream:
              event = json.load(stream)
          number = event.get("number") or (event.get("inputs") or {}).get("pr_number")
          if not str(number).isascii() or not str(number).isdigit() or int(number) < 1:
              raise SystemExit("valid PR number required")
          repo = os.environ["GITHUB_REPOSITORY"]
          api = os.environ["GITHUB_API_URL"] + "/repos/" + repo
          headers = {"Authorization": "Bearer " + os.environ["GH_TOKEN"], "Accept": "application/vnd.github+json", "X-GitHub-Api-Version": "2022-11-28"}
          def request(path, payload=None):
              data = None if payload is None else json.dumps(payload).encode()
              req = urllib.request.Request(api + path, data=data, headers=headers)
              with urllib.request.urlopen(req, timeout=30) as response:
                  return json.load(response)

          def open_pulls():
              pulls = []
              page = 1
              while True:
                  batch = request("/pulls?state=open&per_page=100&page=" + str(page))
                  if not isinstance(batch, list):
                      raise ValueError("invalid open PR response")
                  pulls.extend(batch)
                  if len(batch) < 100:
                      return pulls
                  page += 1

          path = "/pulls/" + str(int(number))
          pr = request(path)
          sha = pr["head"]["sha"]
          if not re.fullmatch(r"[0-9a-f]{40}", sha):
              raise SystemExit("invalid live head SHA")
          run_url = os.environ["GITHUB_SERVER_URL"] + "/" + repo + "/actions/runs/" + os.environ["GITHUB_RUN_ID"]
          def publish(state, description):
              request("/statuses/" + sha, {"state": state, "context": "PR metadata / merge gate", "description": description[:140], "target_url": run_url})

          publish("pending", "Checking all open PRs sharing this commit SHA")
          try:
              pulls = open_pulls()
              snapshot = head_snapshot(pulls, sha)
              if pr["state"] == "open" and not any(p["number"] == pr["number"] for p in snapshot):
                  raise ValueError("trigger PR missing from live open PR inventory")
              result = evaluate_head(pulls, sha, int(os.environ["GOVERNED_PR"]))
              latest = request(path)
              fields = ("body", "draft", "head", "state", "updated_at")
              if any(latest.get(k) != pr.get(k) for k in fields):
                  raise ValueError("trigger PR changed during validation; rerun required")
              if head_snapshot(open_pulls(), sha) != snapshot:
                  raise ValueError("shared-head PR set changed; rerun required")
              publish("success", result)
              print(result)
          except (ValueError, TypeError, KeyError, OSError):
              publish("failure", "HOLD, Draft, conflicting metadata or unverifiable shared-head state")
              raise SystemExit("PR metadata gate blocked; reconcile live shared-head PR state")
          PY
